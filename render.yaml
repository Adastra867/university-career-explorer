services:
  - type: web
    name: university-career-explorer-demo
    branch: demo-deploy
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm admin:init && pnpm start
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JOURNEY_LOAD_ENV
        value: "false"
      - key: CAREER_TRUST_PROXY
        value: "true"
      - key: JOURNEY_AI_PROVIDER
        value: deepseek
      - key: JOURNEY_AI_BASE_URL
        value: https://api.deepseek.com
      - key: JOURNEY_AI_MODEL
        value: deepseek-flash
      - key: JOURNEY_AI_API_KEY
        sync: false
      - key: DEEPSEEK_SEARCH_ENABLED
        value: "true"
      - key: CAREER_DEMO_MODE
        value: "true"
      - key: CAREER_DB_PATH
        value: /tmp/career-demo/career.sqlite
      - key: CAREER_PUBLIC_URL
        value: https://university-career-explorer-demo.onrender.com
      - key: CAREER_ADMIN_USERNAME
        sync: false
      - key: CAREER_ADMIN_PASSWORD
        sync: false
      - key: CAREER_ADMIN_DISPLAY_NAME
        value: 小组展示管理员
