<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动与提交记录 · 职途星轨</title><link rel="stylesheet" href="/p0/p0.css"><script type="module" src="/p0/admin.js"></script></head><body>
<header><div class="wrap topline"><a class="brand" href="/start">✦ 职途星轨</a><nav><a href="/start">学生入口</a><button id="logoutBtn" class="link-button" type="button" hidden>退出登录</button></nav></div></header><main class="wrap"><section class="hero"><span class="eyebrow">活动管理</span><h1>查看学生主动共享的记录</h1><p class="muted">记录来自学生明确提交的快照。私人草稿与未提交材料不在后台展示。</p></section>
<section id="loginCard" class="card"><h2>管理员登录</h2><form id="loginForm"><label class="field"><span>账号</span><input id="username" type="text" name="username" autocomplete="username" required maxlength="100"></label><label class="field"><span>密码</span><input id="password" type="password" name="password" autocomplete="current-password" required maxlength="200"></label><button class="primary" type="submit">登录</button></form><p id="loginStatus" class="status" role="status"></p></section>
<div id="adminWorkspace" hidden><p id="adminStatus" class="status" role="status"></p><div class="split"><section class="card"><h2>收集活动</h2><form id="campaignForm"><label class="field"><span>活动名称</span><input id="campaignName" type="text" maxlength="120" placeholder="例如：能源专业职业探索" required></label><label class="field"><span>简短说明</span><textarea id="campaignDescription" rows="3" maxlength="1000" placeholder="向学生说明本次收集用途。"></textarea></label><label class="field"><span>提交范围说明</span><textarea id="campaignScope" rows="2" maxlength="1000" required>本次任务相关资料、输入片段和分析结果。其他任务与私人草稿不共享。</textarea></label><button class="primary" type="submit">创建活动并生成链接</button></form><div id="campaignList"></div></section><aside class="card"><h2>收集与保存</h2><p class="muted">关闭活动后停止新提交，学生仍可使用个人草稿。此前已成功的提交可继续查询。</p><p class="muted">用户撤回后，全部历史版本的正文立即停止展示；重新提交仅共享新版本。</p><p class="muted">访客编号用于区分记录，不代表身份已经匿名化。</p></aside></div>
<section class="card"><h2>提交记录</h2><form id="filterForm"><div class="filters"><label class="field"><span>活动</span><select id="filterCampaign"><option value="">全部活动</option></select></label><label class="field"><span>任务类型</span><select id="filterTask"><option value="">全部任务</option><option value="explore_direction">探索方向</option><option value="build_experience">整理经历</option><option value="find_opportunity">寻找机会</option><option value="compare_options">比较选择</option></select></label><label class="field"><span>年级</span><input id="filterStage" type="text" maxlength="50" placeholder="可输入“大一”或“未知”"></label><label class="field"><span>专业</span><input id="filterMajor" type="text" maxlength="120"></label><label class="field"><span>开始日期</span><input id="filterFrom" type="date"></label><label class="field"><span>结束日期</span><input id="filterTo" type="date"></label></div><div class="actions"><button class="secondary" type="submit">筛选记录</button><span id="listStatus" class="status" role="status"></span></div></form><div class="table-wrap"><table><thead><tr><th>访客 / 活动</th><th>任务 / 年级专业</th><th>本次问题</th><th>提交时间 / 版本</th><th>确认情况 / 状态</th><th>操作</th></tr></thead><tbody id="recordRows"></tbody></table></div><div class="actions"><button id="prevPageBtn" class="secondary" type="button">上一页</button><span id="pageLabel" class="small"></span><button id="nextPageBtn" class="secondary" type="button">下一页</button></div></section></div>
</main><dialog id="detailDialog" aria-labelledby="detailTitle"><div class="dialog-head"><h2 id="detailTitle">提交快照</h2><button id="closeDetailBtn" class="secondary" type="button">关闭</button></div><p class="muted small">原始输入、资料来源与分析结果分别展示。此处不关联读取学生的当前私人草稿。</p><div id="detailContent" class="snapshot"></div><p id="detailStatus" class="status" role="status"></p></dialog><footer>职途星轨 · 管理员工作台</footer></body></html>
